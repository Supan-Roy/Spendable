<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#121824"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5A3"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5A3"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="8"/>
  
  <!-- Glowing Inner Ring -->
  <rect x="48" y="48" width="416" height="416" rx="96" fill="none" stroke="url(#primaryGrad)" stroke-width="4" opacity="0.3" filter="url(#glow)"/>

  <!-- Dynamic Liquidity Shield & S Symbol -->
  <g transform="translate(256, 256) scale(0.85)">
    <!-- Outer Financial Wave/Shield -->
    <path d="M0 -180 C100 -180 180 -120 180 0 C180 130 80 200 0 230 C-80 200 -180 130 -180 0 C-180 -120 -100 -180 0 -180 Z" fill="none" stroke="url(#primaryGrad)" stroke-width="24" stroke-linecap="round"/>

    <!-- Dynamic Runway Growth Wave (Emerald Glow) -->
    <path d="M-110 40 Q -40 -60 30 10 T 110 -70" fill="none" stroke="#00E5A3" stroke-width="20" stroke-linecap="round" filter="url(#glow)"/>
    
    <!-- Stylized S Curve Core -->
    <path d="M50 -90 C50 -130 -50 -130 -50 -70 C-50 -10 60 -30 60 40 C60 110 -50 120 -60 70" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>

    <!-- Upper Trend Spark Pin -->
    <circle cx="110" cy="-70" r="14" fill="#00E5A3" filter="url(#glow)"/>
  </g>
</svg>
